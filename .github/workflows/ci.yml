name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, tests, vérification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Installer qlang
        run: |
          curl -fsSL https://raw.githubusercontent.com/quenti77/qlang/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: qlang --version
      - name: Essais (avec le vrai serveur)
        run: QLANG_BIN="$(which qlang)" ./gradlew test
      - run: ./gradlew buildPlugin
      - run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: qlang-jetbrains
          path: build/distributions/*.zip
